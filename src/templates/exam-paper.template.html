body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.8 Vazirmatn,Tahoma,"Segoe UI",sans-serif}

.bar button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;border:0;border-radius:9px;padding:5px 12px;background:var(--btn);color:var(--btnfg);cursor:pointer}
.bar button.alt{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--bd)}
.bar button:focus-visible,.del:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.bar small{opacity:.6;flex-basis:100%;text-align:center;font-size:12px}
.sheet{position:relative;overflow:hidden;display:grid;gap:8px;width:min(210mm,100% - 12px);margin:10px auto 30px;padding:8px;border-radius:16px;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.12)}

.sheet>*{position:relative}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;color:#fff;background:var(--blk)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:36px;background:var(--logo) center/contain no-repeat}
.brand b{display:block;font-size:18px;font-weight:700;line-height:1.4}

.meta{justify-self:end;display:grid;min-width:150px}

.meta div:last-child{border:0}

.info{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.f{display:flex;align-items:center;gap:7px;min-width:0;padding:4px 9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.7)}

.f span{display:block;font-size:10.5px;line-height:1.5;color:var(--mut)}

.lh,.q{display:grid;grid-template-columns:44px 1fr 60px}
.lh{margin-bottom:-8px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--soft);font-size:12px;font-weight:700;text-align:center}
.lh span{padding:4px 0}
.lh span:nth-child(2){text-align:start;padding-inline:12px;border-inline:1px solid var(--line)}
#L{counter-reset:q;overflow:hidden;border:1px solid var(--line);border-radius:0 0 12px 12px;background:rgba(255,255,255,.7)}
#L>:last-child{border-bottom:0}
.q{counter-increment:q;border-bottom:1px solid var(--line)}
.n{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0}
.n::before{content:counter(q,persian);font-weight:700}
.q>div:nth-child(2){padding:9px 12px;border-inline:1px solid var(--line)}
.qt{min-height:1.8em}
.ans{height:44px;margin-top:4px;background:repeating-linear-gradient(transparent 0 21px,#e4e4e4 21px 22px)}
.b{display:flex;justify-content:center;padding:9px 0;font-weight:700}
.b .ic{display:none}
.bv{min-width:3ch;text-align:center}

.q:hover .del,.del:focus-visible{opacity:1}
@media (hover:none){.del{opacity:.7}}
.sec{display:flex;align-items:center;gap:7px;padding:5px 12px;border-bottom:1px solid var(--line);background:var(--soft);font-weight:700;break-after:avoid}
.sec .ic{width:14px;height:14px;color:var(--mut)}
.st{flex:1}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:12.5px;font-weight:500}
.foot span{display:flex;align-items:center;gap:6px}
.foot .ic{color:var(--mut)}

@media (max-width:640px){

}

<div class="ttl"><i>باسمه تعالی</i><h1>{{examTitle}}</h1><p>{{grade}} {{field}}</p></div>
<div class="meta">
<div data-i="star"><span>بارم کل</span><b>{{totalScore}}</b></div>
<div data-i="clock"><span>مدت آزمون</span><b>{{duration}}</b></div>
<div data-i="file"><span>نوع برگه</span><b>آزمون تشریحی</b></div>
</div>
</header>
<section class="info">{{studentInfo}}</section>
<div class="lh"><span>ردیف</span><span>شرح سؤال</span><span>بارم</span></div>
<div id="L">{{questionBlocks}}</div>
<footer class="foot"><span data-i="star">جمع بارم: <b>{{totalScore}}</b></span><span data-i="check">موفق و پیروز باشید</span><span><i class="mini"></i>مدار، نمونه سؤال</span></footer>
</main>
</body>
</html>
